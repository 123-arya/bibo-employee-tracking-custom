name: Bibo Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: false

      - name: Test backend
        working-directory: apps/backend
        run: go test ./...

      - name: Build backend
        working-directory: apps/backend
        run: go build ./cmd/server

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          script: |

            set -e
            # Create parent folder
            mkdir -p "$HOME/bibo"

            # Clone or update Bibo repository
            if [ ! -d "$HOME/bibo/bibo-employee-tracking-custom/.git" ]; then
              git clone -b main \
                https://github.com/123-arya/bibo-employee-tracking-custom.git \
                "$HOME/bibo/bibo-employee-tracking-custom"
            else
              cd "$HOME/bibo/bibo-employee-tracking-custom"
              git fetch origin
              git checkout main
              git pull --ff-only origin main
            fi

            echo "Bibo repository cloned or updated successfully"
            ls -la "$HOME/bibo/bibo-employee-tracking-custom"
