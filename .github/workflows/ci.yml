name: Bibo backend

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/backend


    steps:
      - name: Code checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: apps/backend/go.sum

      - name: Download dependencies
        working-directory: apps/backend
        run: go mod download

      - name: Check formatting
        working-directory: apps/backend
        run: |
          files="gofmt -w $(find . -type f -name '*.go')"
          if [ -n "$files" ]; then
            echo "These files need gofmt:"
            echo "$files"
            exit 1
          fi
      - name: Run tests
        working-directory: apps/backend
        run: go test ./...

      - name: Build backend
        working-directory: apps/backend
        run: go build ./cmd/server
