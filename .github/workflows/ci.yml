
name: Bibo Backend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        working-directory: apps/backend
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: true

      - name: Test backend
        working-directory: apps/backend
        run: go test ./...

      - name: Build verification
        working-directory: apps/backend
        run: go build ./cmd/server

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          printf '%s\n' "$EC2_SSH_KEY" > deploy_key
          chmod 600 deploy_key

          ssh -o StrictHostKeyChecking=accept-new \
            -i deploy_key "$EC2_USER@$EC2_HOST" '
              if [ -d ~/bibo-employee-tracking-custom/.git ]; then
                cd ~/bibo-employee-tracking-custom
                git pull --ff-only origin main
              else
                git clone \
                  https://github.com/123-arya/bibo-employee-tracking-custom.git \
                  ~/bibo-employee-tracking-custom
              fi
            '
