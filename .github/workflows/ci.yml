name: Bibo Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/backend/go.mod
          cache: false

      - name: Test backend
        working-directory: apps/backend
        run: go test ./...

      - name: Build backend
        working-directory: apps/backend
        run: go build ./cmd/server

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" '
            set -e
            if [ -d "bibo-employee-tracking-custom/.git" ]; then
              cd "bibo-employee-tracking-custom"
              git pull --ff-only origin main
            else
               git clone https://github.com/123-arya/bibo-employee-tracking-custom.git \
               "bibo-employee-tracking-custom"
            fi
            echo "Bibo backend source deployed successfully."
          '
