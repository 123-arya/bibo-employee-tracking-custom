name: Keycloak CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Keycloak to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key \
            "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE_SCRIPT'
              set -e

              sudo apt-get update
              sudo apt-get install -y openjdk-21-jdk git

              mkdir -p "$HOME/keycloak"

              if [ -d "$HOME/keycloak/bibo-employee-tracking-custom/.git" ]; then
                cd "$HOME/keycloak/bibo-employee-tracking-custom"
                git fetch origin
                git checkout main
                git pull --ff-only origin main
              else
                git clone \
                  -b keycloak https://github.com/123-arya/bibo-employee-tracking-custom.git \
                  "$HOME/keycloak/bibo-employee-tracking-custom"
                cd "$HOME/keycloak/bibo-employee-tracking-custom"
              fi

              java -version
